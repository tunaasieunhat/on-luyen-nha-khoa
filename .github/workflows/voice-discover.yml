name: Voice discover
on:
  push:
    branches: [voice-gen]
    paths: ['voice-src/discover.py', '.github/workflows/voice-discover.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cài VieNeu-TTS + công cụ kiểm tra
        run: |
          python -m pip install --upgrade pip
          pip install "vieneu==3.8.3" soundfile praat-parselmouth faster-whisper
          pip show vieneu | head -5
      - name: Thử giọng
        run: python voice-src/discover.py out
      - name: Đẩy kết quả lên nhánh voice-out
        if: always()
        run: |
          cd out && for f in *.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -ac 1 -b:a 64k "${f%.wav}.mp3" && rm "$f"; done; cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan voice-out
          git rm -rq --cached .
          git add -f out
          git commit -qm "Voice discover ${GITHUB_SHA::7}"
          git push -f origin HEAD:voice-out
